name: 🐞 Bug 报告 / Bug report
description: 报告汉化工具本身的问题（识别失败、汉化失败、回滚异常、生成文件异常等）
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面的信息填完整——缺少 `detect --json` 输出或程序版本时，问题通常无法复现。
        Thanks for the report. Please fill in as much as you can — without the `detect --json` output or the program
        version, the issue usually cannot be reproduced.

        提交前请确认：
        - 已阅读 [docs/SUPPORTED-APPS.md](https://github.com/allen793/artcraft-hanhua/blob/main/docs/SUPPORTED-APPS.md)，目标程序确实在支持范围内；
          Read the support matrix first: the target program must be within the supported range.
        - **主程序补丁只实测支持 v0.41.0**；其它版本会被工具拒绝，这不是 bug。
          The main-app patch is measured for v0.41.0 only; other versions are refused by design.
        - **杀软报毒 / SmartScreen 提示请先看 [docs/FAQ.md](https://github.com/allen793/artcraft-hanhua/blob/main/docs/FAQ.md)**，那里已有分步处置。
          For antivirus false positives / SmartScreen prompts, read docs/FAQ.md first.
        - **安全问题请勿在此公开提交**，请按 [SECURITY.md](https://github.com/allen793/artcraft-hanhua/blob/main/SECURITY.md) 私密报告。
          Security issues must be reported privately.

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认 / Preflight
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题（I searched existing issues）
          required: true
        - label: 我已阅读 README 与 docs/FAQ.md 的常见问题（BOM、App 更新后需重跑、方框缺字、杀软误报）（I read the README and docs/FAQ.md）
          required: true
        - label: 这不是安全漏洞（安全漏洞走私密报告）(This is not a security vulnerability)
          required: true
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清楚、简洁地描述实际发生了什么。Describe clearly and concisely what actually happened.
      placeholder: 例如：对 DesignCraft 执行 hanhua 后，界面仍是英文…… / e.g. after `hanhua`, DesignCraft's UI is still English
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望发生什么。What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 按顺序列出可复现的最小步骤，包含你执行的完整命令。Minimal ordered steps, including the exact commands you ran.
      placeholder: |
        1. node bin/artcraft-hanhua.mjs detect
        2. node bin/artcraft-hanhua.mjs hanhua --dry-run
        3. node bin/artcraft-hanhua.mjs hanhua
        4. 启动 DesignCraft，界面……
    validations:
      required: true

  - type: input
    id: artcraft-version
    attributes:
      label: ArtCraft 版本 / ArtCraft version
      description: 出问题的程序名与版本号；主程序可在关于/版本信息中查看。Program name and version; the main app shows it in About/version info.
      placeholder: ArtCraft 主程序 v0.41.0 / ArtCraft Launcher v0.3.2 / DesignCraft vX.Y.Z
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本 / Windows version
      description: 运行 `winver` 可查看。Run `winver`.
      placeholder: Windows 11 23H2 (22631.4169)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本 / Node.js version
      description: 运行 `node --version` 的输出。Output of `node --version`.
      placeholder: v20.11.1
    validations:
      required: true

  - type: dropdown
    id: elevated
    attributes:
      label: 是否使用管理员权限运行？/ Run as administrator?
      description: |
        你是用普通权限还是"以管理员身份运行"的终端/程序？两者行为不同，请如实填写。
        Did you run the terminal/program as a standard user or elevated as administrator?
      options:
        - "否，普通用户权限（No, standard user）"
        - "是，以管理员身份运行（Yes, elevated / Run as administrator）"
        - "不确定（Not sure）"
    validations:
      required: true

  - type: textarea
    id: detect-json
    attributes:
      label: detect --json 输出 / detect --json output
      description: |
        粘贴 `node bin/artcraft-hanhua.mjs detect --json` 的完整输出。
        **请先用 `C:\Users\<你的用户名>` 之类的占位符替换掉个人路径**，但不要删除结构信息。
        Paste the full output. Replace personal paths with placeholders like `C:\Users\<you>`, but keep the structure.
      render: json
      placeholder: |
        （把该命令的完整输出原样粘贴到这里，不要只给结论）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 相关命令的完整输出（stdout 与 stderr）。同一格式的重复行可以省略，但不要只给一句结论。
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / Screenshot
      description: |
        界面类问题（方框缺字、文案未替换、白屏、报错弹窗）**必须**有截图：直接把图片粘贴进这个框即可。
        **请裁掉或打码个人信息**（用户名、文件路径、工程内容）。
        如果确实无法截图（例如无图形界面），请写清原因——不要留空。
        UI issues (tofu boxes, untranslated text, blank window, error dialogs) **require** a screenshot: paste the
        image directly into this box. Crop or blur anything personal. If you truly cannot take one, state why.
    validations:
      required: true

  - type: dropdown
    id: reverted
    attributes:
      label: 是否已用 revert 回滚？/ Reverted with `revert`?
      description: 出问题后是否执行过 `node bin/artcraft-hanhua.mjs revert`。Did you run `revert` after the problem appeared?
      options:
        - "是，已回滚，回滚后恢复正常"
        - "是，已回滚，但回滚后问题依旧"
        - "否，尚未回滚"
        - "不适用（未执行过 hanhua）"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 备份文件是否存在（如 `*.bak-before-hanhua`）、你尝试过的其他办法等。可选。Optional.
    validations:
      required: false
