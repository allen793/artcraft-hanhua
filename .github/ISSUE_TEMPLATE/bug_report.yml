name: 🐞 Bug 报告 / Bug report
description: 报告汉化工具本身的问题（识别失败、汉化失败、回滚异常、生成文件异常等）
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面的信息填完整——缺少 `detect --json` 输出或程序版本时，问题通常无法复现。

        提交前请确认：
        - 已阅读 [docs/SUPPORTED-APPS.md](https://github.com/allen793/artcraft-hanhua/blob/main/docs/SUPPORTED-APPS.md)，目标程序确实在支持范围内；
        - **安全问题请勿在此公开提交**，请按 [SECURITY.md](https://github.com/allen793/artcraft-hanhua/blob/main/SECURITY.md) 私密报告。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
        - label: 我已阅读 README 的常见问题（BOM、App 更新后需重跑、方框缺字）
          required: true
        - label: 这不是安全漏洞（安全漏洞走私密报告）
          required: true
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚、简洁地描述实际发生了什么。
      placeholder: 例如：对 DesignCraft 执行 hanhua 后，界面仍是英文……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出可复现的最小步骤，包含你执行的完整命令。
      placeholder: |
        1. node bin/artcraft-hanhua.mjs detect
        2. node bin/artcraft-hanhua.mjs hanhua --dry-run
        3. node bin/artcraft-hanhua.mjs hanhua
        4. 启动 DesignCraft，界面……
    validations:
      required: true

  - type: input
    id: artcraft-version
    attributes:
      label: ArtCraft 版本
      description: 出问题的程序名与版本号；主程序可在关于/版本信息中查看。
      placeholder: ArtCraft 主程序 v0.41.0 / ArtCraft Launcher v0.3.2 / DesignCraft vX.Y.Z
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      description: 运行 `winver` 可查看。
      placeholder: Windows 11 23H2 (22631.4169)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      description: 运行 `node --version` 的输出。
      placeholder: v20.11.1
    validations:
      required: true

  - type: textarea
    id: detect-json
    attributes:
      label: detect --json 输出
      description: |
        粘贴 `node bin/artcraft-hanhua.mjs detect --json` 的完整输出。
        **请先用 `C:\Users\<你的用户名>` 之类的占位符替换掉个人路径**，但不要删除结构信息。
      render: json
      placeholder: |
        （把该命令的完整输出原样粘贴到这里，不要只给结论）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 相关命令的完整输出（stdout 与 stderr）。同一格式的重复行可以省略，但不要只给一句结论。
      render: text
    validations:
      required: true

  - type: dropdown
    id: reverted
    attributes:
      label: 是否已用 revert 回滚？
      description: 出问题后是否执行过 `node bin/artcraft-hanhua.mjs revert`。
      options:
        - "是，已回滚，回滚后恢复正常"
        - "是，已回滚，但回滚后问题依旧"
        - "否，尚未回滚"
        - "不适用（未执行过 hanhua）"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、备份文件是否存在（如 `*.bak-before-hanhua`）、你尝试过的其他办法等。可选。
    validations:
      required: false
