name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository. No secrets are used anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tool operates on a Windows installation: it reads the Windows registry,
  # resolves %APPDATA%, and rewrites Windows configuration files. The test suite
  # therefore exercises Windows semantics and runs on windows-latest only.
  # Platform-independent checks (syntax, translation data) run in `static` below.
  test:
    name: test (windows-latest, node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # NOTE: there is deliberately NO `npm install` / `npm ci` step.
      # This project has zero third-party runtime and dev dependencies, so a
      # clone is enough to run everything. Do not add an install step; if a
      # change appears to require one, that change is out of policy (see
      # CONTRIBUTING.md).

      - name: Report toolchain versions
        run: |
          node --version
          npm --version

      - name: Run tests (node --test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node --test 2>&1 | Tee-Object -FilePath test-output.txt
          $status = $LASTEXITCODE
          if ($status -ne 0 -and (Select-String -Path test-output.txt -Pattern 'could not find|no test files' -Quiet)) {
            Write-Host '::warning::node --test found no test files; the test gate is skipped.'
            exit 0
          }
          exit $status

      - name: Syntax check CLI entry point
        shell: pwsh
        run: |
          if (Test-Path bin/artcraft-hanhua.mjs) {
            node --check bin/artcraft-hanhua.mjs
          } else {
            Write-Host '::warning::bin/artcraft-hanhua.mjs not found; skipping syntax check.'
          }

  # Platform-independent gate: runs anywhere, catches syntax errors and a broken
  # or truncated translation table even if the Windows matrix is unavailable.
  static:
    name: static checks (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every source file
        shell: bash
        run: |
          set -euo pipefail
          find . -name node_modules -prune -o -name '*.mjs' -print | while read -r f; do
            node --check "$f"
          done
          echo "OK: every .mjs file parses."

      - name: Validate data/translations.tsv
        shell: bash
        run: |
          set -euo pipefail
          f=data/translations.tsv
          [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }

          # No BOM: the runtime parsers must see a plain UTF-8 file.
          if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
            echo "::error::$f starts with a UTF-8 BOM; it must be BOM-less."
            exit 1
          fi

          header=$(head -n 1 "$f")
          [ "$header" = "$(printf 'id\tenglish\tchinese')" ] || {
            echo "::error::unexpected header: $header"; exit 1; }

          rows=$(( $(wc -l < "$f") - 1 ))
          if [ "$rows" -ne 2773 ]; then
            echo "::error::expected 2773 translation rows, found $rows"; exit 1
          fi

          # Every data row must have exactly two tab separators and a non-empty translation.
          awk -F'\t' 'NR>1 { if (NF != 3) { print "::error::row " NR " has " NF " fields"; bad=1 } if ($3 == "") { print "::error::row " NR " has an empty translation"; bad=1 } } END { exit bad }' "$f"

          echo "OK: 2773 translation rows, 3 columns, no BOM."

  repo-guard:
    name: repo guard (no binaries, no large files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if binaries or archives are tracked
        shell: bash
        run: |
          set -euo pipefail

          # Checked-in files only: the point is what the repository distributes.
          tracked=$(git ls-files -z | tr '\0' '\n')

          # Executables, libraries, installers, archives, and fonts are refused
          # outright. Images are NOT listed here, so a contributor's own
          # screenshot can live in docs/; screenshots or assets extracted from
          # ArtCraft are refused by review policy (see CONTRIBUTING.md) and by
          # the large-file limit below.
          bad=$(printf '%s\n' "$tracked" \
            | grep -Ei '\.(exe|dll|msi|msix|so|dylib|bin|dat|pak|zip|7z|rar|cab|tar|gz|tgz|ttf|otf|woff2?)$' \
            || true)

          if [ -n "$bad" ]; then
            echo "::error::Tracked binary/archive/asset files are not allowed in this repository."
            printf '%s\n' "$bad"
            exit 1
          fi

          echo "OK: no binary or archive files are tracked."

      - name: Fail if any tracked file exceeds 2 MiB
        shell: bash
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::Tracked file is $size bytes (> 2 MiB). Large files do not belong here."
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"
